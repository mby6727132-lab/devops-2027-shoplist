# backend-deployment.yml - the image we built, with passwords from the Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend                  # התווית שלפיה ה-Deployment מזהה את ה-pods שלו
  template:
    metadata:
      labels:
        app: backend                # אותה תווית בדיוק, מודבקת על ה-pods
    spec:
      containers:
        - name: backend
          image: shoplist-backend:local   # ה-image שנבנה בשלב 1, כולל התג
          imagePullPolicy: Never    # לא להוריד מהרשת, ה-image כבר במחשב
          env:
            - name: DB_HOST
              value: postgres       # שם ה-Service של Postgres
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB        # המפתח שמחזיק את שם המסד
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER      # המפתח שמחזיק את המשתמש
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD  # המפתח שמחזיק את הסיסמה
          ports:
            - containerPort: 5000   # הפורט של Flask
          readinessProbe:
            httpGet:
              path: /health         # הנתיב שעונה "אני מוכן"
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10