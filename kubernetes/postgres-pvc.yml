# postgres-pvc.yml - request for persistent storage. Products survive when the pod is deleted
apiVersion: v1
kind: PersistentVolumeClaim   # בקשה לאחסון קבוע שנשמר גם כשה-pod נמחק
metadata:
  name: postgres-pvc
  namespace: shoplist
spec:
  accessModes:
    - ReadWriteOnce           # רק node אחד יכול לכתוב לאחסון בכל רגע
  resources:
    requests:
      storage: 1Gi            # גיגה-בייט אחד


      